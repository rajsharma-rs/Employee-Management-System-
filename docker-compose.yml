services:
  backend:
    image: rajsharmaa/ems-backend:1.2
    ports:
      - "3131:3131"
    environment:
      MONGO_URI: mongodb://mongodb:27017/test
    depends_on:
      - mongodb

  frontend:
    image: rajsharmaa/ems-frontend:1.2.3
    ports:
      - "80:80"
    depends_on:
      - backend

  mongodb:
    image: mongo:8
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data: